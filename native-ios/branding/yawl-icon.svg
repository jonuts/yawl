<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Yawl icon v4: single sail, no mizzen. The main sail carries an X —
       a pencil (/) crossed with a barbell (\). Log it, lift it.
       Dropping the mizzen freed the whole canvas for one big sail, so the X
       is sized to that sail's incircle (r=194 here vs 160 with the mizzen). -->
  <rect width="1024" height="1024" fill="#1c1917"/>

  <!-- mast -->
  <rect x="204" y="60" width="20" height="684" rx="10" fill="#f5f5f4"/>

  <!-- main sail -->
  <path d="M 222 88 L 222 736 L 900 736 Z" fill="#f5f5f4"/>

  <!-- ================= the X ================= -->

  <!-- pencil, "/" -->
  <g transform="translate(416,542) rotate(-45)">
    <rect x="-180" y="-29" width="24" height="58" rx="11" fill="#78716c"/>
    <rect x="-158" y="-29" width="26" height="58" fill="#57534e"/>
    <rect x="-132" y="-29" width="262" height="58" fill="#d97706"/>
    <path d="M 130 -29 L 130 29 L 180 0 Z" fill="#fbbf24"/>
    <path d="M 180 0 L 157 -13 L 157 13 Z" fill="#1c1917"/>
  </g>

  <!-- barbell, "\" — halo pass first so the crossing reads at small sizes -->
  <g transform="translate(416,542) rotate(45)">
    <g fill="none" stroke="#f5f5f4" stroke-width="22" stroke-linejoin="round">
      <rect x="-124" y="-10" width="248" height="20" rx="10"/>
      <rect x="-152" y="-50" width="28" height="100" rx="6"/>
      <rect x="124" y="-50" width="28" height="100" rx="6"/>
      <rect x="-180" y="-33" width="25" height="66" rx="6"/>
      <rect x="155" y="-33" width="25" height="66" rx="6"/>
    </g>
    <g fill="#1c1917">
      <rect x="-124" y="-10" width="248" height="20" rx="10"/>
      <rect x="-152" y="-50" width="28" height="100" rx="6"/>
      <rect x="124" y="-50" width="28" height="100" rx="6"/>
      <rect x="-180" y="-33" width="25" height="66" rx="6"/>
      <rect x="155" y="-33" width="25" height="66" rx="6"/>
    </g>
  </g>

  <!-- hull -->
  <path d="M 168 736 L 918 736 L 828 842 Q 545 870 258 842 Z" fill="#d97706"/>

  <!-- water -->
  <path d="M 140 912 Q 240 882 340 912 T 540 912 T 740 912 T 940 912"
        stroke="#f5f5f4" stroke-opacity="0.35" stroke-width="20" stroke-linecap="round" fill="none"/>
</svg>
